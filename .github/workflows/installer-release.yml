name: Installer release

on:
  push:
    tags:
      - "setup-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode signing key
        env:
          NLRC_KEYSTORE_BASE64: ${{ secrets.NLRC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NLRC_KEYSTORE_BASE64" ]; then
            echo "::error::NLRC_KEYSTORE_BASE64 secret is missing; refusing to build an unsigned release."
            exit 1
          fi
          echo "$NLRC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nlrc.jks"

      - name: Build signed release APK
        working-directory: launcher
        env:
          NLRC_KEYSTORE: ${{ runner.temp }}/nlrc.jks
          NLRC_KEYSTORE_PASSWORD: ${{ secrets.NLRC_KEYSTORE_PASSWORD }}
          NLRC_KEY_ALIAS: ${{ secrets.NLRC_KEY_ALIAS }}
          NLRC_KEY_PASSWORD: ${{ secrets.NLRC_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Check the APK is signed
        run: |
          # An unsigned build is named app-release-unsigned.apk; never ship that.
          test -f launcher/app/build/outputs/apk/release/app-release.apk || {
            echo "::error::Signed app-release.apk not found; check the NLRC_* secrets."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nlrc-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  bundle:
    needs: apk
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nlrc-apk
          path: apk

      - name: Place the APK for bundling
        shell: bash
        run: |
          mkdir -p installer/src-tauri/resources
          cp apk/app-release.apk installer/src-tauri/resources/nlrc.apk

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: installer/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: installer
        run: |
          npm ci
          npm ci --prefix ui

      - name: Run Rust tests
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: installer/src-tauri
        run: cargo test

      # The bundle config adds the APK as a resource; tauri-build fails in dev when it is absent,
      # so it lives in a separate config that only release builds pass in.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: installer
          tagName: ${{ github.ref_name }}
          releaseName: "NLRC Setup ${{ github.ref_name }}"
          releaseDraft: true
          args: --config src-tauri/tauri.bundle.conf.json ${{ matrix.args }}
